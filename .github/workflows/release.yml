name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      electrs_ref:
        description: 'electrs tag/branch to build (defaults to the triggering ref)'
        required: false
        default: ''

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest

          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Checkout tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}

      - name: Checkout electrs source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: romanz/electrs
          ref: ${{ inputs.electrs_ref || github.ref_name }}
          path: checkout

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          push: true

          provenance: false
          sbom: false

          tags: |
            ${{ env.IMAGE_LC }}:${{ github.ref_name }}-${{ matrix.arch }}

          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Checkout for tag inspection
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check if this is the latest semver tag
        id: latest_check
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          git fetch --tags --quiet
          LATEST=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -1)
          if [ "$LATEST" = "$CURRENT_TAG" ]; then
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_LATEST: ${{ steps.latest_check.outputs.is_latest }}
        run: |
          LATEST_FLAG=""
          if [ "$IS_LATEST" = "true" ]; then
            LATEST_FLAG="--tag ${IMAGE_LC}:latest"
          fi
          docker buildx imagetools create \
            $LATEST_FLAG \
            --tag "${IMAGE_LC}:${REF_NAME}" \
            "${IMAGE_LC}:${REF_NAME}-amd64" \
            "${IMAGE_LC}:${REF_NAME}-arm64"

      - name: Inspect manifest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker buildx imagetools inspect "${IMAGE_LC}:${REF_NAME}"
